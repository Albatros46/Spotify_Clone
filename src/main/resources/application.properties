spring.application.name=Spotify_Clone
server.port=8042

# Secrets are NOT in this file. They come from environment variables or, for local development,
# from config/application-secrets.properties (gitignored, template: *.example next to it).
spring.config.import=optional:file:./config/application-secrets.properties

# Database (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spotify_music}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Lazy relations are read in @Transactional services, never while rendering the HTTP response
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=30m
app.jwt.refresh-token-expiration=7d

# Uploaded files (served under /uploads/**)
app.storage.song-dir=uploads/songs
app.storage.image-dir=uploads/images
app.base-url=http://localhost:8042
app.frontend-urls=http://localhost:5173,http://127.0.0.1:5173

# Demo account + songs + playlists for trying the app locally (credentials in the README).
# NEVER enable on a real server: the demo password is public. Start with: --app.demo.enabled=true
app.demo.enabled=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Mail (forgot password - next step)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Gemini AI (song insights - next step). Empty key = feature off, the app still starts.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash
gemini.api.timeout=30000
