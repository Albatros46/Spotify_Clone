# Tests run against an in-memory H2 database in PostgreSQL mode: mvn test needs no PostgreSQL
spring.datasource.url=jdbc:h2:mem:spotify;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=POSITION,KEY,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Tests use the same Flyway migrations as production, so a broken migration fails the build
spring.jpa.hibernate.ddl-auto=validate

app.jwt.secret=test-only-secret-test-only-secret-0123456789
app.storage.song-dir=target/test-uploads/songs
app.storage.image-dir=target/test-uploads/images
